<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard EOD - Estações PT & ES</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📊 EOD Dashboard</h1>
                <p class="subtitle">Monitorização de End of Day - Estações Portugal & Espanha</p>
            </div>
            <div class="header-info">
                <span class="current-time" id="currentTime">--:--:--</span>
                <span class="refresh-btn" id="refreshBtn">🔄 Atualizar</span>
            </div>
        </header>

        <!-- Stats Summary -->
        <section class="stats-summary">
            <div class="stat-card completed">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completas</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pendentes</div>
            </div>
            <div class="stat-card processing">
                <div class="stat-number" id="processingCount">0</div>
                <div class="stat-label">Em Andamento</div>
            </div>
            <div class="stat-card error">
                <div class="stat-number" id="errorCount">0</div>
                <div class="stat-label">Erros</div>
            </div>
        </section>

        <!-- Filters -->
        <section class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="completed">✓ Completas</button>
            <button class="filter-btn" data-filter="pending">⏳ Pendentes</button>
            <button class="filter-btn" data-filter="processing">⚙️ Processando</button>
            <button class="filter-btn" data-filter="error">✗ Erros</button>
        </section>

        <!-- Dashboard Grid -->
        <section class="dashboard-grid">
            <div id="stationsContainer" class="stations-container">
                <!-- Cards serão inseridos aqui via JavaScript -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Última atualização: <span id="lastUpdate">--:--:--</span></p>
            <p>🟢 Online • Próxima atualização em 30s</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
